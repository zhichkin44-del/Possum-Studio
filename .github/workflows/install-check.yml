name: install-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  install-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install FFmpeg (Linux, as in README)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install dependencies (as in README)
        run: npm ci
      - name: Run tests (as in README)
        run: npm test
