name: install-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  install-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install FFmpeg with drawtext (Linux, as in README)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          /usr/bin/ffmpeg -hide_banner -filters | grep -q drawtext
          echo "FFMPEG=/usr/bin/ffmpeg" >> "$GITHUB_ENV"
          echo "FFPROBE=/usr/bin/ffprobe" >> "$GITHUB_ENV"
      - name: Install dependencies (as in README)
        run: npm ci
      - name: Run tests (as in README)
        run: npm test
